<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>따라하면 끝 Studio</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --ink: #1d1d1f; --muted: #6b7280; --line: #e5e7eb; --accent: #ff3b3b; --ok: #0b7a3b; --warn: #b45309; --blue: #1f4e9b; }
  * { box-sizing: border-box; } body { margin: 0; font-family: "Pretendard", "Noto Sans KR", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 18px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0 18px 0 0; } header h1 span { color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; } nav a.on { background: #111; color: #fff; }
  main { max-width: 1240px; margin: 24px auto; padding: 0 20px; }
  .grid { display: grid; gap: 14px; } .g4 { grid-template-columns: repeat(4, 1fr); } .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .stat .n { font-size: 34px; font-weight: 900; } .stat .l { color: var(--muted); font-size: 13px; }
  h2 { font-size: 16px; margin: 0 0 12px; } h3 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; } th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; } th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #eee; }
  .pill.planned { background: #e8eefc; color: var(--blue); } .pill.producing { background: #fff3cd; color: var(--warn); } .pill.produced, .pill.scheduled, .pill.done { background: #dcfce7; color: var(--ok); } .pill.error { background: #fee2e2; color: #b91c1c; } .pill.skipped { background: #eee; color: #777; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; padding: 7px 12px; border-radius: 9px; cursor: pointer; font-weight: 600; } button.pri { background: #111; color: #fff; border-color: #111; } button.sm { padding: 4px 9px; font-size: 12px; } button.danger { color: #b91c1c; }
  input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; } label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .muted { color: var(--muted); } .small { font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 13px; background: #fff; } .chip.on { background: #111; color: #fff; border-color: #111; }
  .topic { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; display: flex; justify-content: space-between; } .topic.off { opacity: .45; border-style: dashed; }
  pre { background: #0f1320; color: #d1d5db; padding: 10px; border-radius: 10px; font-size: 12px; max-height: 220px; overflow: auto; }
  .thumb { width: 96px; border-radius: 6px; } .banner { background: #fff8e6; border: 1px solid #f5d58a; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  @media (max-width: 900px) { .g4, .g3, .g2 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header><h1>▶ 따라하면 끝 <span>Studio</span></h1>
  <nav><a href="#dash">대시보드</a><a href="#channels">채널</a><a href="#packs">주제팩</a><a href="#schedule">일정</a><a href="#jobs">작업</a><a href="#settings">설정</a></nav>
  <span id="mode" class="small muted" style="margin-left:auto"></span></header>
<main id="app"></main>

<script>
const $ = (s) => document.querySelector(s);
const api = async (m, u, b) => { const r = await fetch(u, { method: m, headers: { 'content-type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }); return r.json(); };
const LANGS = { ko: '한국어', en: '영어', hi: '힌디어', es: '스페인어', id: '인니어', ja: '일본어' };
const route = () => (location.hash || '#dash').slice(1);
window.addEventListener('hashchange', render); render();

async function render() {
  const r = route(); document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', a.hash === '#' + r));
  const o = await api('GET', '/api/overview');
  $('#mode').textContent = (o.settings.dry ? '건식 모드(업로드 안 함)' : '실제 업로드') + ' · ' + (o.settings.target === 'live' ? '실제 사이트 녹화' : '연습 폼 녹화') + (o.settings.fakeTts ? ' · 무음 TTS(테스트)' : '');
  const views = { dash, channels, packs, schedule, jobs, settings }; $('#app').innerHTML = await (views[r] || dash)(o);
}

// ---------- dashboard ----------
async function dash(o) {
  const sc = await api('GET', '/api/schedule?from=' + today() + '&to=' + addDays(today(), 6));
  return `<div class="grid g4">
    <div class="card stat"><div class="n">${o.connected}/${o.channels}</div><div class="l">연결된 채널</div></div>
    <div class="card stat"><div class="n">${o.planned}</div><div class="l">예정된 영상</div></div>
    <div class="card stat"><div class="n">${o.producedToday}</div><div class="l">오늘 제작·예약 완료</div></div>
    <div class="card stat" style="${o.errors ? 'border-color:#fca5a5' : ''}"><div class="n">${o.errors}</div><div class="l">오류</div></div></div>
    ${!o.hasClientSecret ? `<div class="banner" style="margin-top:14px">⚠️ <b>upload/secrets/client_secret.json</b> 이 없어서 유튜브 계정을 연결할 수 없습니다. Google Cloud → OAuth 클라이언트(데스크톱 앱) JSON을 그 경로에 두세요. 제작·건식 실행은 지금도 됩니다.</div>` : ''}
    <div class="card" style="margin-top:14px"><h2>이번 주</h2>${table(sc, true)}</div>`;
}

// ---------- channels ----------
async function channels() {
  const chs = await api('GET', '/api/channels'); const packs = await api('GET', '/api/packs');
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">채널 ${chs.length}</h2><button class="pri" onclick="newChannel()">+ 채널 추가</button></div>
  <div class="grid g2">${chs.map((c) => channelCard(c, packs)).join('') || '<div class="card muted">채널이 없습니다. "채널 추가"로 시작하세요.</div>'}</div>`;
}
function channelCard(c, packs) {
  return `<div class="card" id="ch-${c.id}">
    <div class="row" style="justify-content:space-between"><div><b style="font-size:16px">${esc(c.name)}</b> <span class="small muted">${c.connected ? '✅ ' + esc(c.youtubeName || '연결됨') : '⬜ 미연결'}</span></div>
      <div class="row"><button class="sm" onclick="connect('${c.id}')">${c.connected ? '다시 연결' : 'YouTube 연결'}</button><button class="sm danger" onclick="del('${c.id}')">삭제</button></div></div>
    <label>이름</label><input value="${esc(c.name)}" onchange="upd('${c.id}',{name:this.value})" style="width:100%">
    <label>언어 (업로드 순서대로 섞임)</label><div class="row">${Object.entries(LANGS).map(([k, v]) => `<span class="chip ${c.langs.includes(k) ? 'on' : ''}" onclick="toggle('${c.id}','langs','${k}')">${v}</span>`).join('')}</div>
    <label>주제팩</label><div class="row">${packs.map((p) => `<span class="chip ${c.packs.includes(p.id) ? 'on' : ''}" onclick="toggle('${c.id}','packs','${p.id}')" title="${esc(p.desc.ko)}">${p.icon} ${esc(p.name.ko)} <span class="small muted">${p.topics.filter((t) => t.ready).length}/${p.topics.length}</span></span>`).join('')}</div>
    <div class="grid g3"><div><label>하루 개수</label><input type="number" min="1" max="10" value="${c.perDay}" onchange="upd('${c.id}',{perDay:+this.value})"></div>
      <div><label>처음 N일은 절반 속도</label><input type="number" min="0" value="${c.rampDays ?? 14}" onchange="upd('${c.id}',{rampDays:+this.value})"></div>
      <div><label>시작일</label><input type="date" value="${c.startDate}" onchange="upd('${c.id}',{startDate:this.value})"></div></div>
    <div class="grid g2"><div><label>공개 시각(시, 슬롯 순)</label><input value="${(c.publishHours || []).join(',')}" onchange="upd('${c.id}',{publishHours:this.value.split(',').map(Number)})"></div>
      <div><label>시간대</label><input value="${c.tz}" onchange="upd('${c.id}',{tz:this.value})"></div></div>
    <label>제휴 링크 (JSON: {"fallback":{"esim":"…","hotel":"…"},"말레이시아":{…}})</label><input value='${esc(JSON.stringify(c.affiliate || {}))}' onchange="try{upd('${c.id}',{affiliate:JSON.parse(this.value)})}catch(e){alert('JSON 형식 오류')}" style="width:100%">
    <div class="row" style="margin-top:12px"><button class="pri" onclick="planCh('${c.id}',30)">30일 일정 생성</button><button onclick="planCh('${c.id}',7)">7일만</button><a class="small" href="#schedule" onclick="localStorage.ch='${c.id}'">일정 보기 →</a></div></div>`;
}
async function newChannel() { const name = prompt('채널 이름', '따라하면 끝 — 입국신고서·비자'); if (!name) return; await api('POST', '/api/channels', { name }); render(); }
async function upd(id, patch) { await api('PUT', '/api/channels/' + id, patch); }
async function toggle(id, key, v) { const c = (await api('GET', '/api/channels')).find((x) => x.id === id); const arr = c[key].includes(v) ? c[key].filter((x) => x !== v) : [...c[key], v]; await upd(id, { [key]: arr }); render(); }
async function del(id) { if (confirm('채널과 일정을 삭제할까요?')) { await api('DELETE', '/api/channels/' + id); render(); } }
async function connect(id) { const r = await api('GET', `/api/channels/${id}/connect`); if (r.error) return alert(r.error); location.href = r.url; }
async function planCh(id, days) { const r = await api('POST', `/api/channels/${id}/plan`, { days }); alert(`${r.created}개 생성, 대기 ${r.remaining}개`); localStorage.ch = id; location.hash = '#schedule'; }

// ---------- packs ----------
async function packs() {
  const ps = await api('GET', '/api/packs');
  return `<h2>주제팩 — 서식 정의가 있는 것(진하게)만 제작됩니다. 흐린 것은 로드맵입니다.</h2><div class="grid g2">${ps.map((p) => `<div class="card"><div class="row" style="justify-content:space-between"><b>${p.icon} ${esc(p.name.ko)}</b><span class="small muted">${p.topics.filter((t) => t.ready).length}/${p.topics.length} 준비</span></div>
    <div class="small muted" style="margin:4px 0 10px">${esc(p.desc.ko)}</div><div class="grid" style="gap:6px">${p.topics.map((t) => `<div class="topic ${t.ready ? '' : 'off'}"><span>${t.flag || ''} ${esc(t.title.ko)}</span><span class="small muted">${t.ready ? t.langs.map((l) => LANGS[l] || l).join('·') : '예정'}</span></div>`).join('')}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:14px"><h2>새 서식 추가하는 법</h2><ol class="small"><li><code>forms/mdac.js</code>를 복사해 <code>forms/&lt;id&gt;.js</code>를 만들고 <code>pack</code>, 선택자, 단계별 설명/실수 문구를 채웁니다.</li><li><code>forms/_packs.js</code>의 해당 팩 <code>roadmap</code>에 id가 있으면 자동으로 "준비"로 바뀝니다.</li><li>채널에서 "일정 생성"을 다시 누르면 새 서식이 뒤에 붙습니다.</li></ol></div>`;
}

// ---------- schedule ----------
async function schedule() {
  const chs = await api('GET', '/api/channels'); const cur = localStorage.ch && chs.find((c) => c.id === localStorage.ch) ? localStorage.ch : chs[0]?.id;
  const rows = cur ? await api('GET', '/api/schedule?channel=' + cur) : [];
  return `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">일정</h2><select onchange="localStorage.ch=this.value;render()">${chs.map((c) => `<option value="${c.id}" ${c.id === cur ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    <span class="small muted">${rows.length}개 · 예정 ${rows.filter((r) => r.status === 'planned').length} · 완료 ${rows.filter((r) => ['produced', 'scheduled'].includes(r.status)).length} · 오류 ${rows.filter((r) => r.status === 'error').length}</span>
    <button class="sm" style="margin-left:auto" onclick="addRow('${cur}')">+ 행 추가</button></div><div class="card">${table(rows, false)}</div>`;
}
function table(rows, withChannel) {
  if (!rows.length) return '<div class="muted small">일정이 없습니다.</div>';
  return `<table><tr><th>날짜</th><th>#</th><th>주제</th><th>언어</th><th>상태</th><th>결과</th><th></th></tr>${rows.map((r) => `<tr>
    <td>${r.date}</td><td>${r.slot}</td><td>${esc(r.title)}<div class="small muted">${r.pack} · ${r.topicId}</div></td><td>${LANGS[r.lang] || r.lang}</td>
    <td><span class="pill ${r.status}">${r.status}</span>${r.error ? `<div class="small" style="color:#b91c1c">${esc(r.error)}</div>` : ''}</td>
    <td>${r.thumb ? `<a href="/out/${rel(r.video)}" target="_blank"><img class="thumb" src="/out/${rel(r.thumb)}"></a>` : ''} ${r.videoUrl && r.videoUrl.startsWith('http') ? `<a href="${r.videoUrl}" target="_blank" class="small">${r.videoUrl}</a>` : ''}${r.publishAt ? `<div class="small muted">공개 ${new Date(r.publishAt).toLocaleString()}</div>` : ''}</td>
    <td class="row"><button class="sm" onclick="runRow('${r.id}')">지금 제작</button><button class="sm" onclick="setRow('${r.id}',{status:'skipped'})">건너뛰기</button><button class="sm" onclick="shift('${r.id}','${r.date}',-1)">◀</button><button class="sm" onclick="shift('${r.id}','${r.date}',1)">▶</button>
      <select class="sm" onchange="setRow('${r.id}',{lang:this.value})">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === r.lang ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="sm danger" onclick="delRow('${r.id}')">✕</button></td></tr>`).join('')}</table>`;
}
async function runRow(id) { await api('POST', `/api/schedule/${id}/run`, {}); alert('제작을 시작했습니다. 작업 탭에서 진행 상황을 보세요.'); location.hash = '#jobs'; }
async function setRow(id, p) { await api('PUT', '/api/schedule/' + id, p); render(); }
async function shift(id, d, n) { await setRow(id, { date: addDays(d, n) }); }
async function delRow(id) { await api('DELETE', '/api/schedule/' + id); render(); }
async function addRow(ch) { const topicId = prompt('서식 id (예: mdac)', 'mdac'); if (!topicId) return; const lang = prompt('언어 (ko/en/…)', 'ko'); const date = prompt('날짜', today()); await api('POST', '/api/schedule', { channelId: ch, topicId, lang, date, slot: 1, pack: '', title: topicId + ' ' + lang }); render(); }

// ---------- jobs ----------
async function jobs() {
  const js = await api('GET', '/api/jobs');
  return `<h2>작업 (최근 100)</h2>${js.map((j) => `<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><div><span class="pill ${j.state}">${j.state}</span> <span class="small muted">${j.startedAt?.replace('T', ' ').slice(0, 19)}</span> ${j.outputs?.url ? `<a class="small" href="${j.outputs.url}" target="_blank">${j.outputs.url}</a>` : ''}</div>
    ${j.outputs?.video ? `<a class="small" href="/out/${rel(j.outputs.video)}" target="_blank">영상 열기</a>` : ''}</div><pre>${(j.log || []).map(esc).join('\n')}${j.error ? '\n' + esc(j.error) : ''}</pre></div>`).join('') || '<div class="card muted">작업이 없습니다.</div>'}
  <script>if(${js.some((j) => j.state === 'running')}) setTimeout(render, 5000)<\/script>`;
}

// ---------- settings ----------
async function settings(o) {
  const s = o.settings;
  return `<div class="card"><h2>설정</h2>
    <label>모드</label><div class="row"><span class="chip ${s.dry ? 'on' : ''}" onclick="setS({dry:true})">건식(업로드 안 함)</span><span class="chip ${!s.dry ? 'on' : ''}" onclick="if(confirm('실제로 유튜브에 올라갑니다. 계속할까요?'))setS({dry:false})">실제 업로드</span></div>
    <label>녹화 대상</label><div class="row"><span class="chip ${s.target === 'mock' ? 'on' : ''}" onclick="setS({target:'mock'})">연습 폼(안전)</span><span class="chip ${s.target === 'live' ? 'on' : ''}" onclick="setS({target:'live'})">실제 사이트(선택자 확인 필요)</span></div>
    <label>TTS</label><div class="row"><span class="chip ${s.fakeTts ? 'on' : ''}" onclick="setS({fakeTts:true})">무음(테스트)</span><span class="chip ${!s.fakeTts ? 'on' : ''}" onclick="setS({fakeTts:false})">Google Cloud TTS (GOOGLE_TTS_API_KEY)</span></div>
    <div class="grid g3"><div><label>말하기 속도</label><input type="number" step="0.01" value="${s.tts?.speakingRate ?? 0.97}" onchange="setS({tts:{...${JSON.stringify(s.tts || {})},speakingRate:+this.value}})"></div>
      <div><label>며칠 전에 제작 (leadDays)</label><input type="number" value="${s.leadDays ?? 1}" onchange="setS({leadDays:+this.value})"></div>
      <div><label>배경음악 파일(선택)</label><input value="${s.bgm || ''}" onchange="setS({bgm:this.value||null})"></div></div>
    <h3>동작 방식</h3><div class="small muted">워커가 30초마다 "예정" 상태이면서 날짜가 오늘+leadDays 이내인 행을 하나씩 제작합니다. 건식 모드에서는 영상·썸네일·메타데이터만 만들고 업로드하지 않습니다. 실제 업로드는 비공개로 올라간 뒤 채널의 공개 시각에 자동 공개됩니다.</div></div>`;
}
async function setS(p) { await api('PUT', '/api/settings', p); render(); }

// ---------- utils ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const rel = (p) => (p || '').split('/out/')[1] || '';
</script>
</body>
</html>
