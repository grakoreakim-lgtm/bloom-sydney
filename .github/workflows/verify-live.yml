# Opens the real government pages and checks that each form's live selectors match.
# Nothing is typed or submitted. Results (screenshots + field dumps) are kept as an artifact.
name: verify-live

on:
  workflow_dispatch:
    inputs:
      forms:
        description: 'Form ids, space separated'
        required: false
        default: 'mdac sgac'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youtube-forms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.50.0
          npx playwright install --with-deps chromium

      - name: Verify
        run: |
          FORMS="${{ github.event.inputs.forms }}"; [ -z "$FORMS" ] && FORMS="mdac sgac"
          node upload/verify-live.js $FORMS | tee verify.log
          { echo '```'; cat verify.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep screenshots and field dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.run_id }}
          path: youtube-forms/out/verify
          retention-days: 14
          if-no-files-found: ignore
