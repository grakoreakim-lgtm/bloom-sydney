# Test-record one form (no narration, no upload) and push the screenshots to branch "test-output" for review.
name: test-record

on:
  workflow_dispatch:
    inputs:
      form: { description: 'form id', required: true, default: 'sgac' }
      target: { description: 'mock or live', required: true, default: 'live' }
      lang: { description: 'ko or en', required: true, default: 'ko' }
      speed: { description: '1 = normal, 0.4 = fast check', required: false, default: '0.4' }

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: youtube-forms } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.50.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
      - name: Record
        env: { F: '${{ github.event.inputs.form }}', T: '${{ github.event.inputs.target }}', L: '${{ github.event.inputs.lang }}', S: '${{ github.event.inputs.speed }}' }
        run: node record.js "$F" --target "$T" --lang "$L" --speed "$S"
      - name: Publish screenshots
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/x/test && cp youtube-forms/out/*.png /tmp/x/test/ 2>/dev/null || true
          git config user.name "test bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan test-output
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/x/test . && git add test && git commit -qm "test $(date +%F-%H%M)" && git push -f origin test-output
